[package]
name = "oxi_core"
version = "0.1.0"
edition = "2021"
license = "CECILL-2.1"
publish = false

[features]
host-test = []

[dependencies]
aes = { version = "0.8.4", default-features = false }
cbc = { version = "0.1.2", default-features = false, features = ["block-padding"] }
cmac = { version = "0.7.2", default-features = false }
hmac = { version = "0.12.1", default-features = false }
hkdf = { version = "0.12.4", default-features = false }
p256 = { version = "0.13.2", default-features = false, features = ["ecdh", "ecdsa"] }
rustlet_runtime = { path = "../../rustlets/rustlet_runtime" }
sha2 = { version = "0.10.9", default-features = false }
