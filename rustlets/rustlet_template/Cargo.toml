[workspace]
resolver = "2"

[profile.release]
panic = "abort"
opt-level = "z"
lto = true
codegen-units = 1
strip = "debuginfo"

[package]
name = "rustlet_template"
version = "0.1.0"
edition = "2021"
license = "CECILL-2.1"
publish = false

[dependencies]
rustlet_runtime = { path = "../rustlet_runtime", features = ["runtime"] }
